name: Deploy app to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Atualiza o snapshot do dashboard Yalt diariamente às 04:17 UTC
    # (horário dessincronizado de outros crons para não competir).
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Publish only the single-file PWA, not the rest of the vault.
      - name: Assemble site
        run: |
          mkdir -p _dist
          cp index.html _dist/index.html
          cp index.html _dist/404.html
          cp sw.js _dist/sw.js
          touch _dist/.nojekyll

      # Yalt dashboard (snapshot estático). Step aditivo — NUNCA derruba o
      # deploy do Tales of Talles se a API do CRM falhar.
      - name: Generate Yalt dashboard snapshot
        continue-on-error: true
        env:
          YALT_API_KEY: ${{ secrets.YALT_API_KEY }}
        run: |
          cd "70 Sistema/Automacao/yalt-dashboard"
          node generate.mjs --out "${{ github.workspace }}/_dist/yalt/index.html" || echo "::warning::Yalt dashboard generation failed (non-blocking)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        timeout-minutes: 2
        with:
          path: _dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
