name: Vault Lint

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["feature/*", "manus/*", "auditoria/*"]

jobs:
  vault-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run vault-lint
        id: lint
        run: |
          REPO_ROOT="$GITHUB_WORKSPACE"
          VAULT_ROOT="$REPO_ROOT"
          node "70 Sistema/Automacao/vault-lint/lint.mjs" --quiet
          echo "lint_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Comment PR with lint summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const reportPath = require('path').join(process.env.GITHUB_WORKSPACE, 'output', 'vault_lint.md');
            let body = '## Vault-lint\n';
            if (fs.existsSync(reportPath)) {
              const text = fs.readFileSync(reportPath, 'utf8').split('\n').slice(0, 40).join('\n');
              body += '```' + text + '```\n';
            } else {
              body += '_Relatório não encontrado._\n';
            }
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
